name: Ledger

# A publish run's record of what it put on the wiki is a fact rather than a
# proposal: the hash it writes is the digest of the section the wiki now
# serves, so reviewing it means reading a page of hexadecimal against a page
# that has already changed. Left to be reviewed by hand it was not reviewed at
# all - ten solutions and a hundred and sixty-seven records sat on branches
# that were never pushed - so a pull request touching only the ledger is
# approved here, and lands once its raiser arms auto-merge.
#
# Everything else still needs a person, a solution above all. The path test
# below is the whole of that distinction, so widening it widens what lands
# unread.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  ledger_only:
    name: Land a ledger-only change

    runs-on: ubuntu-latest

    timeout-minutes: 5

    # Only for what this repository's own agent raises. A fork can open a pull
    # request touching nothing but the ledger as easily as we can, and this job
    # would otherwise approve it.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.actor == 'ghul-coder[bot]' || github.actor == 'degory') &&
      github.event.pull_request.draft == false

    steps:
    # The base commit, not the pull request's head: the test that decides what
    # lands unread must not come from the change it is judging.
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}

    - name: Decide whether the change is ledger-only
      id: scope
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        set -eu

        gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' > files.txt

        echo "changed:"
        sed 's/^/  /' files.txt

        # A ledger entry, or a task.json carrying the same task's state.
        # Anything else - a solution, a test expectation, the tooling, this
        # file - is out of scope and the job stops here.
        if [ -x scripts/ledger-only.sh ] && scripts/ledger-only.sh < files.txt ; then
            echo "ledger_only=true" >> "$GITHUB_OUTPUT"
        else
            echo "ledger_only=false" >> "$GITHUB_OUTPUT"
        fi

    # Approval only. Auto-merge is armed by whoever raised the pull request:
    # auto-merge armed with this workflow's token never enters the merge
    # queue, since GitHub starts no workflow run for what that token does.
    - name: Approve
      if: steps.scope.outputs.ledger_only == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        set -eu

        gh api -X POST "repos/$REPO/pulls/$PR/reviews" \
            -f event=APPROVE \
            -f body='Ledger only: this records what is already on the wiki.'
