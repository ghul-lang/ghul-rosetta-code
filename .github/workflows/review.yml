name: Code review

# Independent of the CI workflow's trigger, which does not fire on these
# events. Taking a pull request out of draft, or editing its description,
# starts or restarts the review without starting, cancelling or invalidating
# any CI job. A review can also be dispatched manually for one pull request
# (from its head branch, so the review reads that branch's tree): the run
# ignores the content-fingerprint and dependency-bot short-circuits and
# reviews the PR in full. The job's concurrency group cancels a review still
# running when a new one starts.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [ main ]

  workflow_dispatch:
    inputs:
      pull-request-number:
        description: "Number of the pull request to review. Dispatch from the pull request's head branch, so the review reads that branch's tree. The run ignores the content-fingerprint and dependency-bot short-circuits and reviews the PR in full."
        required: true
        type: string

jobs:
  # A ledger-only change records what is already on the wiki; ledger.yml
  # approves it, and there is nothing in it for a reviewer to read.
  scope:
    name: Review scope
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ledger_only: ${{ steps.scope.outputs.ledger_only }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}

    - id: scope
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        set -eu

        gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' > files.txt

        if [ -x scripts/ledger-only.sh ] && scripts/ledger-only.sh < files.txt ; then
            echo "ledger_only=true" >> "$GITHUB_OUTPUT"
        else
            echo "ledger_only=false" >> "$GITHUB_OUTPUT"
        fi

  code_review:
    name: Code review
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.ledger_only != 'true' && (github.event_name == 'workflow_dispatch' || ((github.event.action != 'edited' || github.event.changes.body != null) && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)) }}
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || inputs.pull-request-number }}
      cancel-in-progress: true
    uses: ghul-lang/ghul-code-review/.github/workflows/review.yml@v11
    with:
      pull-request-number: ${{ inputs.pull-request-number }}
      runner: ubuntu-latest
      provider: ${{ vars.CODE_REVIEW_PROVIDER }}
      idle-timeout-seconds: ${{ fromJSON(vars.CLAUDE_REVIEW_IDLE_TIMEOUT_SECONDS || '180') }}
      max-attempts: ${{ fromJSON(vars.CLAUDE_REVIEW_MAX_ATTEMPTS || '1') }}
      gh-app-id: ${{ vars.GHUL_REVIEWER_APP_ID }}
      ghul-reference: true
      style-reference: true
      extra-repositories: ghul-style
      require-description-section: false
      prompt: |
        Review pull request #${{ inputs.pull-request-number || github.event.pull_request.number }} on ${{ github.repository }}.

        You run in parallel with CI. Whether each task builds and matches its captured output is gated by CI before merge - that's not your job. Trust the diff as written.

        Read these files first, in order:
        1. .github/claude-review.md - what this repo is, and what to watch for in it
        2. AGENTS.md - how a solution is written here
        3. STYLE.md - authoritative terminology, prose, and identifier rules
        4. GHUL.md - ghūl language reference, consult as needed while reading the diff
    secrets:
      claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      zai-auth-token: ${{ secrets.ZAI_API_KEY }}
      gh-app-private-key: ${{ secrets.GHUL_REVIEWER_PRIVATE_KEY }}
